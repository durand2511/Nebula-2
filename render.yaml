# Render Blueprint — defines EXACTLY ONE web service (no monorepo auto-split).
# Render builds the repo with the root Dockerfile (corepack pnpm@11.8.0 → install → build api-server).
# Secrets (sync:false) are entered in the Render dashboard, never committed here.
services:
  - type: web
    name: nebula-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: standard           # 2 GB RAM (imports van grote sites hebben headroom nodig).
    region: frankfurt
    healthCheckPath: /api/healthz
    autoDeploy: true
    # Persistent disk for imported binary media (WP uploads, images, fonts, …). The bytes live here;
    # project_assets rows in Postgres point at them. Grow sizeGB in the dashboard if a site is bigger.
    disk:
      name: media
      mountPath: /data
      sizeGB: 10
    envVars:
      # ── non-secret config (safe to commit) ──
      - key: MEDIA_DIR
        value: /data
      # Give V8 room on the 2 GB instance (default is too low / mis-detected in containers). ~1.5 GB
      # heap leaves headroom for off-heap Buffers. Was 400 — that CAPPED the heap and caused OOM.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: NODE_ENV
        value: production
      - key: PLATFORM_HOST
        value: nebulabookings.com
      - key: CUSTOMERS_TARGET
        value: customers.nebulabookings.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: durand2511@gmail.com
      - key: SMTP_FROM
        value: durand2511@gmail.com
      - key: LOG_LEVEL
        value: info
      # ── secrets: you fill these in the Render dashboard (kept out of git) ──
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_SECRET_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # PUBLIC_APP_URL / PUBLIC_API_URL: add in the dashboard once you know the Render URL / your domain.
      # NOT needed: PORT (Render injects it) and AI_INTEGRATIONS_OPENAI_* (image/audio AI is optional).
