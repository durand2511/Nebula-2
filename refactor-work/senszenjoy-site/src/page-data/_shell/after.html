 is no existing __utmb cookie. The cookie is updated every time data is sent to the Google Analytics server.</div><div class="cookie-duration">30 minutes after last activity</div></div><div class="wpconsent-preferences-list-item" data-cookie-id="3139" part="wpconsent-cookies-list-item"><div class="cookie-name">__utmc</div><div class="cookie-desc">Used only with old Urchin versions of Google Analytics and not with GA.js. Was used to distinguish between new sessions and visits at the end of a session.</div><div class="cookie-duration">End of session (browser)</div></div><div class="wpconsent-preferences-list-item" data-cookie-id="3140" part="wpconsent-cookies-list-item"><div class="cookie-name">__utmz</div><div class="cookie-desc">Contains information about the traffic source or campaign that directed user to the website. The cookie is set when the GA.js javascript is loaded and updated when data is sent to the Google Anaytics server</div><div class="cookie-duration">6 months after last activity</div></div><div class="wpconsent-preferences-list-item" data-cookie-id="3141" part="wpconsent-cookies-list-item"><div class="cookie-name">__utmv</div><div class="cookie-desc">Contains custom information set by the web developer via the _setCustomVar method in Google Analytics. This cookie is updated every time new data is sent to the Google Analytics server.</div><div class="cookie-duration">2 years after last activity</div></div><div class="wpconsent-preferences-list-item" data-cookie-id="3142" part="wpconsent-cookies-list-item"><div class="cookie-name">__utmx</div><div class="cookie-desc">Used to determine whether a user is included in an A / B or Multivariate test.</div><div class="cookie-duration">18 months</div></div><div class="wpconsent-preferences-list-item" data-cookie-id="3143" part="wpconsent-cookies-list-item"><div class="cookie-name">_ga</div><div class="cookie-desc">ID used to identify users</div><div class="cookie-duration">2 years</div></div><div class="wpconse
